# Daily site check
#
# Every morning at 8 AM Adelaide time this checks the race calendars, gear
# prices and links the site relies on. It saves a list of suggested changes
# to the "site-check-data" branch, and the private stats dashboard shows that
# list with Add and Dismiss buttons.
#
# Safe fixes are made automatically and saved to main: race dates that the
# organiser changed, links that moved for good, and exact shop prices. New
# races and anything that needs a decision wait on the dashboard.
#
# Then it sends the morning race alerts (entries open today, entries close
# tomorrow, new race added) to people who turned them on at mtbsa.com.au.
# That part needs the ALERTS_TOKEN secret (see "Race alerts" in README.md),
# and quietly does nothing until it's there.
#
# It's free: it only uses GitHub's built-in Actions and the free GITHUB_TOKEN.
#
# Why two times? GitHub runs schedules in UTC, and Adelaide moves between
# UTC+10:30 (daylight saving) and UTC+9:30. Both times are booked, and the
# script only does the check on the one that is really 8 AM in Adelaide.
#   21:30 UTC = 8:00 AM ACDT (summer, roughly Oct to Apr)
#   22:30 UTC = 8:00 AM ACST (winter, roughly Apr to Oct)
#
# GitHub can start scheduled runs late when it is busy, sometimes by hours.
#
# To run it now: Actions tab > Daily site check > Run workflow.

name: Daily site check

on:
  schedule:
    - cron: "30 21 * * *"
    - cron: "30 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # to save the safe fixes to main and results to site-check-data

concurrency:
  group: daily-site-check
  cancel-in-progress: false

env:
  DATA_BRANCH: site-check-data

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get the saved results branch
        run: |
          if git fetch --depth=1 origin "$DATA_BRANCH"; then
            git worktree add data FETCH_HEAD
          else
            git worktree add --detach data
            git -C data checkout --orphan "$DATA_BRANCH"
            git -C data rm -rfq .
            echo '{"decisions": {}}' > data/decisions.json
          fi

      - name: Check calendars, gear and links
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: >
          python3 .github/site-check/check.py --auto-fix
          --out data/results.json --decisions data/decisions.json
          --commit-message "$RUNNER_TEMP/fixes.txt"

      - name: Save the automatic fixes to the website
        if: steps.check.outputs.skipped != 'true'
        run: |
          [ -f "$RUNNER_TEMP/fixes.txt" ] || { echo "Nothing to fix automatically"; exit 0; }
          cat "$RUNNER_TEMP/fixes.txt"
          git config user.name "MTB SA site check"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u  # only files already on the site
          git commit -qF "$RUNNER_TEMP/fixes.txt"
          for i in 1 2 3 4; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main || { git rebase --abort; exit 1; }
            sleep $((i * 5))
          done
          exit 1

      - name: Send race alerts
        if: steps.check.outputs.skipped != 'true'
        continue-on-error: true   # a hiccup here never stops the dashboard results saving
        env:
          ALERTS_TOKEN: ${{ secrets.ALERTS_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$ALERTS_TOKEN" ]; then
            echo "Race alerts aren't set up yet (no ALERTS_TOKEN secret). See README.md."
            exit 0
          fi
          pip install --quiet --disable-pip-version-check pywebpush==2.5.0
          python3 .github/site-check/alerts.py --state data/alerts-sent.json

      - name: Save results for the dashboard
        if: steps.check.outputs.skipped != 'true'
        run: |
          cd data
          git config user.name "MTB SA site check"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results.json decisions.json
          [ ! -f alerts-sent.json ] || git add alerts-sent.json
          # [CF-Pages-Skip] stops Cloudflare Pages building this branch.
          git commit -qm "[CF-Pages-Skip] Daily site check results" || { echo "No changes"; exit 0; }
          for i in 1 2 3 4; do
            git push origin "HEAD:refs/heads/$DATA_BRANCH" && exit 0
            # The dashboard may have saved a decision meanwhile: keep both.
            git pull --rebase -X theirs origin "$DATA_BRANCH" || true
            sleep $((i * 5))
          done
          exit 1
