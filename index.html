<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mountain Biking SA · Race Calendar</title>
  <meta name="description" content="Every South Australian mountain bike race on one simple calendar.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html">Mountain Biking <span>SA</span></a>
      <nav>
        <a href="index.html" aria-current="page">Calendar</a>
        <a href="new-to-racing.html">New to racing?</a>
        <a href="links.html">Links</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section id="calendar-view">
      <h1>SA race calendar</h1>
      <p class="lead">Tap a race to see what it is and how to enter.</p>

      <div class="levels" id="levels" aria-label="Show race levels"></div>

      <div class="month-bar">
        <button type="button" class="nav-btn" id="prev" aria-label="Previous month">‹</button>
        <h2 id="month-title" aria-live="polite"></h2>
        <button type="button" class="nav-btn" id="next" aria-label="Next month">›</button>
      </div>

      <div class="cal" role="grid" aria-labelledby="month-title">
        <div class="cal-head" role="row">
          <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
        </div>
        <div class="cal-grid" id="grid"></div>
      </div>
      <p class="today-link"><button type="button" class="link-btn" id="today">Back to this month</button></p>

      <h2 class="list-title" id="list-title">This month</h2>
      <ul class="race-list" id="list"></ul>
    </section>

    <section id="detail-view" hidden></section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>A community project. Not run by AusCycling or any club. Always check the official race page before you go.</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
